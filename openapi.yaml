openapi: 3.1.0
info:
  title: Survey Tool API
  description: ЛР 7. CRUD пользователей и создание и публикация опросов. Учебный API
    без аутентификации.
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
      - Health
      summary: Get Health
      operationId: get_health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/users:
    post:
      tags:
      - Users
      summary: Create User
      operationId: create_user_api_v1_users_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Users
      summary: List Users
      operationId: list_users_api_v1_users_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
                title: Response List Users Api V1 Users Get
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{user_id}:
    get:
      tags:
      - Users
      summary: Get User
      operationId: get_user_api_v1_users__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Users
      summary: Update User
      operationId: update_user_api_v1_users__user_id__put
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Users
      summary: Delete User
      operationId: delete_user_api_v1_users__user_id__delete
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/surveys:
    post:
      tags:
      - Surveys
      summary: Create Survey
      operationId: create_survey_api_v1_surveys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/surveys/{survey_id}:
    get:
      tags:
      - Surveys
      summary: Get Survey
      operationId: get_survey_api_v1_surveys__survey_id__get
      parameters:
      - name: survey_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Survey Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/surveys/{survey_id}/publish:
    post:
      tags:
      - Surveys
      summary: Publish Survey
      operationId: publish_survey_api_v1_surveys__survey_id__publish_post
      parameters:
      - name: survey_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Survey Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateSurveyRequest:
      properties:
        creatorId:
          type: string
          format: uuid
          title: Creatorid
        title:
          type: string
          maxLength: 200
          title: Title
          examples:
          - Service feedback
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
        questions:
          items:
            $ref: '#/components/schemas/QuestionInput'
          type: array
          maxItems: 100
          title: Questions
      additionalProperties: false
      type: object
      required:
      - creatorId
      - title
      title: CreateSurveyRequest
    CreateUserRequest:
      properties:
        email:
          type: string
          maxLength: 255
          title: Email
          examples:
          - student@example.test
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
          examples:
          - DemoPassword123
        displayName:
          type: string
          maxLength: 100
          title: Displayname
          examples:
          - Student
      additionalProperties: false
      type: object
      required:
      - email
      - password
      - displayName
      title: CreateUserRequest
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - timestamp
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        app_name:
          type: string
          title: App Name
        version:
          type: string
          title: Version
        environment:
          type: string
          title: Environment
        uptime_seconds:
          type: integer
          title: Uptime Seconds
      type: object
      required:
      - status
      - app_name
      - version
      - environment
      - uptime_seconds
      title: HealthResponse
    OptionInput:
      properties:
        text:
          type: string
          maxLength: 500
          title: Text
        position:
          type: integer
          title: Position
      additionalProperties: false
      type: object
      required:
      - text
      - position
      title: OptionInput
    OptionResponse:
      properties:
        text:
          type: string
          maxLength: 500
          title: Text
        position:
          type: integer
          title: Position
        id:
          type: string
          format: uuid
          title: Id
      additionalProperties: false
      type: object
      required:
      - text
      - position
      - id
      title: OptionResponse
    QuestionInput:
      properties:
        text:
          type: string
          maxLength: 1000
          title: Text
        type:
          type: string
          enum:
          - text
          - single_choice
          - multiple_choice
          title: Type
        position:
          type: integer
          title: Position
        isRequired:
          type: boolean
          title: Isrequired
          default: true
        options:
          items:
            $ref: '#/components/schemas/OptionInput'
          type: array
          maxItems: 50
          title: Options
      additionalProperties: false
      type: object
      required:
      - text
      - type
      - position
      title: QuestionInput
    QuestionResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        text:
          type: string
          title: Text
        type:
          type: string
          enum:
          - text
          - single_choice
          - multiple_choice
          title: Type
        position:
          type: integer
          title: Position
        isRequired:
          type: boolean
          title: Isrequired
        options:
          items:
            $ref: '#/components/schemas/OptionResponse'
          type: array
          title: Options
      additionalProperties: false
      type: object
      required:
      - id
      - text
      - type
      - position
      - isRequired
      - options
      title: QuestionResponse
    SurveyResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        creatorId:
          type: string
          format: uuid
          title: Creatorid
        title:
          type: string
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        status:
          type: string
          enum:
          - draft
          - published
          - closed
          title: Status
        publishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Publishedat
        createdAt:
          type: string
          format: date-time
          title: Createdat
        questionCount:
          type: integer
          title: Questioncount
        questions:
          items:
            $ref: '#/components/schemas/QuestionResponse'
          type: array
          title: Questions
      additionalProperties: false
      type: object
      required:
      - id
      - creatorId
      - title
      - description
      - status
      - publishedAt
      - createdAt
      - questionCount
      - questions
      title: SurveyResponse
    UpdateUserRequest:
      properties:
        email:
          type: string
          maxLength: 255
          title: Email
        displayName:
          type: string
          maxLength: 100
          title: Displayname
      additionalProperties: false
      type: object
      required:
      - email
      - displayName
      title: UpdateUserRequest
    UserResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          type: string
          title: Email
        displayName:
          type: string
          title: Displayname
        createdAt:
          type: string
          format: date-time
          title: Createdat
      additionalProperties: false
      type: object
      required:
      - id
      - email
      - displayName
      - createdAt
      title: UserResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
